<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Ariana</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;touch-action:none;-webkit-tap-highlight-color:transparent;user-select:none}
body{
  background:#0a0a0f;
  display:flex;align-items:center;justify-content:center;
  font-family:'Plus Jakarta Sans',sans-serif;
  color:#fff;
}
canvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:1;pointer-events:none}
.core{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-container{position:relative;width:clamp(220px,60vmin,460px);height:clamp(220px,60vmin,460px)}
.ring-base{
  position:absolute;inset:0;border-radius:50%;
  border:1.5px solid rgba(255,255,255,.04);
  background:radial-gradient(circle at 30% 25%,rgba(120,80,255,.08),rgba(0,0,0,0) 70%);
}
.ring-glow{
  position:absolute;inset:-30px;border-radius:50%;
  background:radial-gradient(circle at 50% 50%,rgba(160,120,255,.06),transparent 70%);
  animation:breath 4s ease-in-out infinite;
}
@keyframes breath{0%,100%{opacity:.4;transform:scale(1)}50%{opacity:.8;transform:scale(1.05)}}
.ring-1{
  position:absolute;inset:6%;border-radius:50%;
  border:1px solid rgba(160,130,255,.12);
  animation:spin 20s linear infinite;
}
.ring-1::before{content:'';position:absolute;top:-1.5px;left:50%;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:#a082ff;box-shadow:0 0 20px #a082ff66,0 0 60px #a082ff33}
.ring-2{
  position:absolute;inset:18%;border-radius:50%;
  border:1px solid rgba(255,180,100,.1);
  animation:spin 35s linear infinite reverse;
}
.ring-2::before{content:'';position:absolute;top:-1.5px;right:15%;width:5px;height:5px;border-radius:50%;background:#ffb466;box-shadow:0 0 15px #ffb46666}
.ring-3{
  position:absolute;inset:32%;border-radius:50%;
  border:1px dashed rgba(200,160,255,.07);
  animation:spin 50s linear infinite;
}
.ring-3::before{content:'';position:absolute;top:-1.5px;left:30%;width:4px;height:4px;border-radius:50%;background:#c8a0ff;box-shadow:0 0 12px #c8a0ff66}
.ring-4{
  position:absolute;inset:46%;border-radius:50%;
  border:1px solid rgba(255,255,255,.03);
  animation:spin 65s linear infinite reverse;
}
.ring-4::before{content:'';position:absolute;top:-2px;left:60%;width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.15);box-shadow:0 0 10px rgba(255,255,255,.1)}
@keyframes spin{to{transform:rotate(360deg)}}

.avatar{
  position:absolute;inset:20%;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 40% 35%,#1a1530,#0d0b1a);
  box-shadow:inset 0 0 60px rgba(100,80,200,.1),0 0 40px rgba(100,80,200,.05);
}
.avatar-inner{
  width:68%;height:68%;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#6b5cbf,#3a2d7a);
  display:flex;align-items:center;justify-content:center;
  position:relative;
}
.avatar-inner::after{
  content:'';position:absolute;inset:0;border-radius:50%;
  background:radial-gradient(circle at 60% 40%,rgba(255,200,150,.25),transparent 60%);
}
.avatar-letter{
  font-family:'Playfair Display',serif;
  font-size:clamp(2.8rem,9vmin,5.5rem);
  font-style:italic;font-weight:700;
  background:linear-gradient(135deg,#f0e8ff 20%,#c4b0ff 50%,#ffc8a0 85%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
  position:relative;z-index:2;
  filter:drop-shadow(0 0 30px rgba(160,120,255,.3));
  line-height:1;
}

.particles{position:absolute;inset:0;border-radius:50%}

.name{
  margin-top:clamp(16px,4vmin,32px);
  font-family:'Playfair Display',serif;
  font-size:clamp(1.6rem,5vmin,3rem);
  font-style:italic;font-weight:700;
  background:linear-gradient(135deg,#e8ddff,#c4b0ff,#ffc8a0);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
  letter-spacing:.02em;
  opacity:0;transform:translateY(10px);
  animation:fadeIn 1s .8s ease forwards;
}
@keyframes fadeIn{to{opacity:1;transform:translateY(0)}}

.subtitle{
  margin-top:clamp(6px,1.5vmin,12px);
  font-size:clamp(.65rem,1.8vmin,.85rem);
  font-weight:300;letter-spacing:.35em;text-transform:uppercase;
  color:rgba(255,255,255,.3);
  opacity:0;animation:fadeIn 1s 1.2s ease forwards;
}

.status-dot{
  display:inline-block;width:6px;height:6px;border-radius:50%;
  background:#7bff9b;margin-right:8px;
  box-shadow:0 0 10px rgba(123,255,155,.5);
  animation:pulse 2s ease-in-out infinite;
}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

.status-bar{
  margin-top:clamp(16px,3vmin,28px);
  display:flex;align-items:center;
  font-size:clamp(.6rem,1.6vmin,.75rem);
  font-weight:400;letter-spacing:.15em;
  color:rgba(255,255,255,.25);
  opacity:0;animation:fadeIn 1s 1.6s ease forwards;
}

.voice-bars{
  margin-top:clamp(20px,4vmin,36px);
  display:flex;align-items:center;gap:clamp(3px,1vmin,6px);
  height:clamp(24px,5vmin,40px);
  opacity:0;animation:fadeIn 1s 2s ease forwards;
}
.voice-bar{
  width:clamp(3px,.6vmin,4px);
  border-radius:2px;
  background:linear-gradient(to top,rgba(160,130,255,.2),rgba(160,130,255,.6));
  animation:wave 1.6s ease-in-out infinite;
}
.voice-bar:nth-child(1){height:30%;animation-delay:0s}
.voice-bar:nth-child(2){height:55%;animation-delay:.1s}
.voice-bar:nth-child(3){height:40%;animation-delay:.2s}
.voice-bar:nth-child(4){height:70%;animation-delay:.3s}
.voice-bar:nth-child(5){height:45%;animation-delay:.4s}
.voice-bar:nth-child(6){height:65%;animation-delay:.5s}
.voice-bar:nth-child(7){height:35%;animation-delay:.6s}
.voice-bar:nth-child(8){height:80%;animation-delay:.7s}
.voice-bar:nth-child(9){height:50%;animation-delay:.8s}
.voice-bar:nth-child(10){height:60%;animation-delay:.9s}
.voice-bar:nth-child(11){height:38%;animation-delay:1s}
.voice-bar:nth-child(12){height:72%;animation-delay:1.1s}
@keyframes wave{0%,100%{transform:scaleY(.6);opacity:.3}50%{transform:scaleY(1);opacity:.8}}

.hint{
  position:fixed;bottom:clamp(20px,4vh,40px);left:50%;transform:translateX(-50%);
  z-index:2;
  font-size:clamp(.55rem,1.4vmin,.7rem);
  font-weight:300;letter-spacing:.2em;text-transform:uppercase;
  color:rgba(255,255,255,.12);
  animation:fadeIn 1s 3s ease forwards;
  opacity:0;
}

@media(prefers-color-scheme:light){
  body{background:#f5f2f0}
  .ring-base{background:radial-gradient(circle at 30% 25%,rgba(120,80,255,.04),transparent 70%)}
  .ring-1{border-color:rgba(120,80,200,.1)}
  .ring-2{border-color:rgba(200,150,80,.1)}
  .ring-3{border-color:rgba(160,120,200,.07)}
  .ring-4{border-color:rgba(0,0,0,.03)}
  .avatar{background:radial-gradient(circle at 40% 35%,#e8e0f0,#d5cce0);box-shadow:inset 0 0 60px rgba(100,80,200,.06),0 0 40px rgba(100,80,200,.03)}
  .avatar-inner{background:radial-gradient(circle at 35% 30%,#8a7ad0,#5a4d9a)}
  .subtitle{color:rgba(0,0,0,.25)}
  .status-bar{color:rgba(0,0,0,.2)}
  .hint{color:rgba(0,0,0,.1)}
  .ring-glow{background:radial-gradient(circle at 50% 50%,rgba(120,80,200,.04),transparent 70%)}
}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div class="core">
  <div class="ring-container">
    <div class="ring-glow"></div>
    <div class="ring-base"></div>
    <div class="ring-1"></div>
    <div class="ring-2"></div>
    <div class="ring-3"></div>
    <div class="ring-4"></div>
    <div class="avatar">
      <div class="avatar-inner">
        <span class="avatar-letter">A</span>
      </div>
    </div>
  </div>
  <div class="name">Ariana</div>
  <div class="subtitle">— JARVIS —</div>
  <div class="status-bar"><span class="status-dot"></span>HAZIR · SANA KULAK VERİYORUM</div>
  <div class="voice-bars">
    <span class="voice-bar"></span><span class="voice-bar"></span><span class="voice-bar"></span>
    <span class="voice-bar"></span><span class="voice-bar"></span><span class="voice-bar"></span>
    <span class="voice-bar"></span><span class="voice-bar"></span><span class="voice-bar"></span>
    <span class="voice-bar"></span><span class="voice-bar"></span><span class="voice-bar"></span>
  </div>
</div>
<div class="hint">DOKUN · KONUŞ · DİNLE</div>

<script>
const canvas=document.getElementById('bg'),ctx=canvas.getContext('2d');
let W,H,particles=[],mouse={x:-999,y:-999};
function resize(){W=canvas.width=innerWidth;H=canvas.height=innerHeight}
window.addEventListener('resize',resize);resize();

class Dust{
  constructor(){this.reset()}
  reset(){
    this.x=Math.random()*W;this.y=Math.random()*H;
    this.r=Math.random()*1.2+.2;
    this.dx=(Math.random()-.5)*.15;this.dy=(Math.random()-.5)*.15;
    this.life=Math.random();this.maxLife=.5+Math.random()*.5;
    this.h=Math.random()>.6?260:Math.random()>.5?200:30;
    this.s=.3+Math.random()*.4;
  }
  update(){
    this.x+=this.dx;this.y+=this.dy;
    this.life+=.002;
    if(this.life>this.maxLife||this.x<0||this.x>W||this.y<0||this.y>H)this.reset();
    const dx=this.x-W/2,dy=this.y-H/2,dist=Math.hypot(dx,dy);
    const core=Math.min(W,H)*.3;
    if(dist<core){const f=(core-dist)/core;this.x+=dx*f*.002;this.y+=dy*f*.002}
    if(mouse.x>0&&mouse.y>0){
      const mx=this.x-mouse.x,my=this.y-mouse.y,mDist=Math.hypot(mx,my);
      if(mDist<120&&mDist>0){const push=(120-mDist)/120*.8;this.x+=mx/mDist*push;this.y+=my/mDist*push}
    }
  }
  draw(){
    const a=(1-this.life/this.maxLife)*.5;
    ctx.beginPath();ctx.arc(this.x,this.y,this.r,0,Math.PI*2);
    ctx.fillStyle=`hsla(${this.h},${this.s*100}%,70%,${a})`;
    ctx.fill();
  }
}

for(let i=0;i<80;i++)particles.push(new Dust);

let time=0;
function draw(){
  ctx.clearRect(0,0,W,H);
  time+=.005;
  particles.forEach(p=>{p.update();p.draw()});

  const cx=W/2,cy=H/2,r=Math.min(W,H)*.18;
  const grad=ctx.createRadialGradient(cx,cy,0,cx,cy,r*2.5);
  grad.addColorStop(0,'rgba(120,80,255,.03)');
  grad.addColorStop(.5,'rgba(120,80,255,.015)');
  grad.addColorStop(1,'rgba(120,80,255,0)');
  ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);

  const count=4;
  for(let i=0;i<count;i++){
    const angle=time*.3+i*Math.PI*2/count;
    const dist=r*1.8+Math.sin(time*1.2+i*1.5)*20;
    const x=cx+Math.cos(angle)*dist,y=cy+Math.sin(angle)*dist;
    const sz=2+Math.sin(time*2+i)*1.5;
    ctx.beginPath();ctx.arc(x,y,sz,0,Math.PI*2);
    ctx.fillStyle=`hsla(${260+i*20},50%,75%,${.2+Math.sin(time*1.5+i)*.1})`;
    ctx.fill();
  }
  requestAnimationFrame(draw);
}
draw();

document.addEventListener('touchmove',e=>{
  const t=e.touches[0];
  mouse.x=t.clientX;mouse.y=t.clientY;
},{passive:true});
document.addEventListener('touchstart',e=>{
  const t=e.touches[0];
  mouse.x=t.clientX;mouse.y=t.clientY;
},{passive:true});
document.addEventListener('touchend',()=>{mouse.x=-999;mouse.y=-999},{passive:true});
document.addEventListener('mousemove',e=>{mouse.x=e.clientX;mouse.y=e.clientY});
document.addEventListener('mouseleave',()=>{mouse.x=-999;mouse.y=-999});
</script>
</body>
</html>
